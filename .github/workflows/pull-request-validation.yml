name: Pull Request Validation

on:
    push:
        branches:
            - main
        paths-ignore:
            - "**.md"
    pull_request:
        paths-ignore:
            - "**.md"

permissions: {}

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0
    RUSTFLAGS: -D warnings
    CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install cargo nextest
              uses: taiki-e/install-action@cargo-nextest

            - uses: Swatinem/rust-cache@v2

            - name: Compile
              run: cargo check --locked

            - name: Run tests
              run: cargo nextest run --all-targets --all-features

            # nextest skips doctests by design, so nothing else here runs the
            # examples in the documentation.
            - name: Run doctests
              run: cargo test --doc --all-features

    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            # broken_intra_doc_links and bare_urls only warn, so a plain
            # `cargo doc` exits zero over a page of dead links.
            - name: Build documentation
              run: cargo doc --no-deps --all-features
              env:
                  RUSTDOCFLAGS: -D warnings

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy,rustfmt

            - uses: Swatinem/rust-cache@v2

            - name: Run cargo fmt
              run: cargo fmt --all --check

            - name: Run cargo clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  lfs: true

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Install cargo audit tools
              uses: taiki-e/install-action@v2
              with:
                  tool: just,cargo-auditable,cargo-audit

            - uses: Swatinem/rust-cache@v2

            - name: Audit release binaries
              run: just audit
