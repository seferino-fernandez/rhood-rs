[package]
name = "rhood-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Terminal CLI for the Robinhood trading API"
readme = "README.md"
keywords = ["robinhood", "trading", "cli", "stocks"]
categories = ["command-line-utilities", "finance"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rhood-{ target }.{ archive-format }"
bin-dir = "rhood{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"


[lints]
workspace = true

[[bin]]
name = "rhood"
path = "src/main.rs"

[dependencies]
rhood-core = { workspace = true, features = ["clap"] }
secrecy.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "8.0.0"
dialoguer = "0.12.0"
jiff.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rust_decimal.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
